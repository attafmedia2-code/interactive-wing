<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الجناح التفاعلي</title>
    
    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@r128/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/loaders/GLTFLoader.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 100%);
            color: #f1f5f9;
            min-height: 100vh;
            overflow: hidden;
        }
        .container { display: flex; height: 100vh; background: #334155; }
        .sidebar {
            width: 350px;
            background: #1e293b;
            border-right: 1px solid #334155;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #6366f1;
            display: flex;
            gap: 10px;
        }
        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            margin-top: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3); }
        .btn-secondary { background: rgba(99, 102, 241, 0.1); color: #6366f1; border: 1px solid #6366f1; }
        .btn-secondary:hover { background: rgba(99, 102, 241, 0.2); }
        .btn-small { padding: 8px 12px; font-size: 12px; }
        .file-input-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            border: 2px dashed #6366f1;
            border-radius: 8px;
            cursor: pointer;
            background: rgba(99, 102, 241, 0.05);
            transition: all 0.3s;
            text-align: center;
        }
        .file-input-label:hover { background: rgba(99, 102, 241, 0.1); border-color: #ec4899; }
        input[type="file"] { display: none; }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            overflow-x: auto;
        }
        .tab-btn {
            padding: 12px 16px;
            background: transparent;
            border: none;
            color: #cbd5e1;
            cursor: pointer;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
            font-size: 13px;
            white-space: nowrap;
        }
        .tab-btn.active { color: #6366f1; border-bottom-color: #6366f1; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .list-item {
            padding: 12px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid #334155;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .list-item:hover { background: rgba(99, 102, 241, 0.1); border-color: #6366f1; }
        .list-item.active { background: rgba(99, 102, 241, 0.2); border-color: #6366f1; }
        .list-item-title { font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .list-item-desc { font-size: 12px; color: #cbd5e1; }
        .main-viewport {
            flex: 1;
            background: linear-gradient(135deg, #1a1f3a 0%, #0f172a 100%);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        #canvas-container { flex: 1; position: relative; }
        canvas { display: block; }
        .top-bar {
            padding: 16px 24px;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar-title { font-size: 18px; font-weight: 600; }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: slideDown 0.3s ease;
        }
        .alert-success { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid #10b981; }
        .alert-error { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }
        .alert-info { background: rgba(99, 102, 241, 0.1); color: #6366f1; border: 1px solid #6366f1; }
        @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #cbd5e1;
            text-align: center;
        }
        .empty-state-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
        .empty-state-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #f1f5f9; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1e293b;
            border-radius: 12px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            border: 1px solid #334155;
        }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; }
        .form-input, .form-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.5);
            color: #f1f5f9;
            border-radius: 6px;
            font-size: 13px;
        }
        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(15, 23, 42, 0.8);
        }
        .form-textarea { resize: vertical; min-height: 60px; font-family: inherit; }
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
        }
        .color-palette {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .color-option.active {
            border-color: #f1f5f9;
            transform: scale(1.1);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">🎪 الجناح التفاعلي</div>

            <div>
                <div class="section-title">📦 تحميل النموذج</div>
                <label class="file-input-label" id="fileLabel">
                    <div style="font-size: 24px; margin-bottom: 8px;">⬆️</div>
                    <div>اضغط أو اسحب ملف GLB</div>
                    <input type="file" id="fileInput" accept=".glb,.gltf" />
                </label>
                <div id="uploadStatus" style="margin-top: 12px; text-align: center; font-size: 12px;"></div>
            </div>

            <div>
                <div class="section-title">📋 المشاريع</div>
                <div id="projectsList"></div>
                <button class="btn btn-secondary btn-small" onclick="APP.createNewProject()">➕ جديد</button>
            </div>

            <div id="tabsContainer" style="display: none; margin-top: 20px;">
                <div class="tabs">
                    <button class="tab-btn active" onclick="APP.switchTab('hotspots')">🎯</button>
                    <button class="tab-btn" onclick="APP.switchTab('cameras')">📷</button>
                    <button class="tab-btn" onclick="APP.switchTab('tour')">🎬</button>
                    <button class="tab-btn" onclick="APP.switchTab('preview')">👁️</button>
                </div>

                <div id="hotspots-tab" class="tab-content active">
                    <div class="section-title">المناطق</div>
                    <button class="btn btn-primary btn-small" onclick="APP.addHotspot()">➕ إضافة</button>
                    <div id="hotspotsList"></div>
                </div>

                <div id="cameras-tab" class="tab-content">
                    <div class="section-title">الكاميرات</div>
                    <button class="btn btn-primary btn-small" onclick="APP.captureCamera()">📸 حفظ</button>
                    <div id="camerasList"></div>
                </div>

                <div id="tour-tab" class="tab-content">
                    <div class="section-title">الجولة</div>
                    <button class="btn btn-primary btn-small" onclick="APP.autoTour()">✨ تلقائية</button>
                    <div id="tourList"></div>
                </div>

                <div id="preview-tab" class="tab-content">
                    <div class="section-title">المعاينة</div>
                    <button class="btn btn-primary btn-small" onclick="APP.playTour()" style="margin-bottom: 8px;">▶️ تشغيل</button>
                    <button class="btn btn-secondary btn-small" onclick="APP.shareLink()" style="margin-bottom: 8px;">🔗 مشاركة</button>
                    <button class="btn btn-secondary btn-small" onclick="APP.export()">💾 تصدير</button>
                </div>
            </div>

            <div id="alertsContainer" style="margin-top: 20px;"></div>
        </div>

        <div class="main-viewport">
            <div class="top-bar">
                <div class="top-bar-title" id="viewportTitle">🎪 الجناح التفاعلي</div>
                <div style="display: flex; gap: 12px;">
                    <button class="btn btn-small btn-secondary" onclick="APP.resetCamera()">🔄</button>
                </div>
            </div>
            <div id="canvas-container">
                <div class="empty-state">
                    <div class="empty-state-icon">🎪</div>
                    <div class="empty-state-title">حمّل نموذج GLB</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hotspot Modal -->
    <div id="hotspotModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">✨ إضافة منطقة</div>
            <div class="form-group">
                <label class="form-label">الاسم</label>
                <input type="text" id="hotspotName" class="form-input" placeholder="قاعة الاستقبال">
            </div>
            <div class="form-group">
                <label class="form-label">الوصف</label>
                <textarea id="hotspotDesc" class="form-textarea" placeholder="وصف المنطقة..."></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">اللون</label>
                <div class="color-palette">
                    <div class="color-option active" style="background: #ef4444;" data-color="#ef4444"></div>
                    <div class="color-option" style="background: #f59e0b;" data-color="#f59e0b"></div>
                    <div class="color-option" style="background: #10b981;" data-color="#10b981"></div>
                    <div class="color-option" style="background: #3b82f6;" data-color="#3b82f6"></div>
                </div>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary btn-small" onclick="APP.closeModal('hotspotModal')">إلغاء</button>
                <button class="btn btn-primary btn-small" onclick="APP.saveHotspot()">حفظ</button>
            </div>
        </div>
    </div>

    <script>
        const APP = {
            projects: [],
            current: null,
            scene: null,
            camera: null,
            renderer: null,
            controls: null,
            model: null,
            hotspots: [],
            selectedColor: '#ef4444',

            init() {
                this.loadProjects();
                this.setupScene();
                this.setupEvents();
            },

            setupScene() {
                const container = document.getElementById('canvas-container');
                
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x1a1f3a);
                this.scene.fog = new THREE.Fog(0x1a1f3a, 100, 1000);

                this.camera = new THREE.PerspectiveCamera(
                    75,
                    container.clientWidth / container.clientHeight,
                    0.1,
                    10000
                );
                this.camera.position.set(0, 10, 20);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(container.clientWidth, container.clientHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                container.innerHTML = '';
                container.appendChild(this.renderer.domElement);

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;

                const light1 = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(light1);

                const light2 = new THREE.DirectionalLight(0xffffff, 0.8);
                light2.position.set(10, 20, 10);
                this.scene.add(light2);

                const grid = new THREE.GridHelper(100, 10);
                grid.material.transparent = true;
                grid.material.opacity = 0.2;
                this.scene.add(grid);

                window.addEventListener('resize', () => this.onResize());
                this.animate();
            },

            async loadGLB(file) {
                try {
                    this.showAlert('⏳ جاري التحميل...', 'info');
                    
                    const url = URL.createObjectURL(file);
                    const loader = new THREE.GLTFLoader();

                    loader.load(
                        url,
                        (gltf) => {
                            if (this.model) this.scene.remove(this.model);
                            
                            this.model = gltf.scene;
                            this.scene.add(this.model);

                            const box = new THREE.Box3().setFromObject(this.model);
                            const center = box.getCenter(new THREE.Vector3());
                            const size = box.getSize(new THREE.Vector3());
                            const maxDim = Math.max(size.x, size.y, size.z);
                            const cameraZ = maxDim / 2 / Math.tan((this.camera.fov * Math.PI / 180) / 2);

                            this.camera.position.set(center.x, center.y, center.z + cameraZ);
                            this.controls.target.copy(center);
                            this.controls.update();

                            this.createNewProject();
                            this.analyze();

                            this.showAlert('✅ تم التحميل!', 'success');
                            URL.revokeObjectURL(url);
                        },
                        undefined,
                        (error) => {
                            console.error('GLB Load Error:', error);
                            this.showAlert('❌ خطأ: ' + (error.message || 'فشل التحميل'), 'error');
                            URL.revokeObjectURL(url);
                        }
                    );
                } catch (error) {
                    console.error('Error:', error);
                    this.showAlert('❌ ' + error.message, 'error');
                }
            },

            analyze() {
                if (!this.current || !this.model) return;

                const box = new THREE.Box3().setFromObject(this.model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const dist = Math.max(size.x, size.y, size.z) * 1.2;

                this.current.cameras = [];
                const names = ['الأمام', 'اليمين', 'الخلف', 'اليسار'];
                const angles = [0, Math.PI / 2, Math.PI, (3 * Math.PI) / 2];

                angles.forEach((angle, i) => {
                    this.current.cameras.push({
                        id: Date.now() + i,
                        name: names[i],
                        pos: {
                            x: center.x + Math.cos(angle) * dist,
                            y: center.y + size.y * 0.5,
                            z: center.z + Math.sin(angle) * dist
                        },
                        target: center
                    });
                });

                this.current.hotspots = [];
                this.autoTour();
                this.saveProjects();
                this.render();
            },

            createNewProject() {
                this.current = {
                    id: Date.now(),
                    name: `جناح ${this.projects.length + 1}`,
                    cameras: [],
                    hotspots: [],
                    tour: []
                };
                this.projects.push(this.current);
            },

            addHotspot() {
                document.querySelectorAll('.color-option').forEach(e => e.classList.remove('active'));
                document.querySelector('[data-color="#ef4444"]').classList.add('active');
                this.selectedColor = '#ef4444';
                this.openModal('hotspotModal');
            },

            saveHotspot() {
                this.current.hotspots.push({
                    id: Date.now(),
                    name: document.getElementById('hotspotName').value || 'منطقة',
                    desc: document.getElementById('hotspotDesc').value,
                    color: this.selectedColor
                });
                this.saveProjects();
                this.render();
                this.closeModal('hotspotModal');
                this.showAlert('✅ تم الإضافة', 'success');
            },

            captureCamera() {
                this.current.cameras.push({
                    id: Date.now(),
                    name: `كاميرا ${this.current.cameras.length + 1}`,
                    pos: this.camera.position.clone(),
                    target: this.controls.target.clone()
                });
                this.saveProjects();
                this.render();
                this.showAlert('✅ تم الحفظ', 'success');
            },

            autoTour() {
                this.current.tour = this.current.cameras.map((c, i) => ({
                    id: c.id,
                    step: i,
                    cameraId: c.id,
                    duration: 3,
                    title: c.name
                }));
                this.saveProjects();
                this.render();
                this.showAlert('✨ جولة تلقائية', 'success');
            },

            async playTour() {
                if (!this.current.tour.length) {
                    this.showAlert('لا توجد جولة', 'error');
                    return;
                }

                for (const step of this.current.tour) {
                    const cam = this.current.cameras.find(c => c.id === step.cameraId);
                    if (!cam) continue;
                    await this.animCamera(cam.pos, cam.target, step.duration);
                }
            },

            animCamera(pos, target, dur) {
                return new Promise(resolve => {
                    const start = this.camera.position.clone();
                    const startTarget = this.controls.target.clone();
                    const startTime = Date.now();

                    const loop = () => {
                        const t = Math.min((Date.now() - startTime) / (dur * 1000), 1);
                        this.camera.position.lerpVectors(start, new THREE.Vector3(pos.x, pos.y, pos.z), t);
                        this.controls.target.lerpVectors(startTarget, new THREE.Vector3(target.x, target.y, target.z), t);
                        
                        if (t < 1) requestAnimationFrame(loop);
                        else resolve();
                    };
                    loop();
                });
            },

            shareLink() {
                const link = window.location.href;
                const input = document.createElement('input');
                input.value = link;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                this.showAlert('✅ تم النسخ', 'success');
            },

            export() {
                const json = JSON.stringify(this.current, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${this.current.name}.json`;
                a.click();
                URL.revokeObjectURL(url);
            },

            resetCamera() {
                if (this.model) {
                    const box = new THREE.Box3().setFromObject(this.model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const cameraZ = Math.max(size.x, size.y, size.z) / 2 / Math.tan((this.camera.fov * Math.PI / 180) / 2);
                    this.camera.position.set(center.x, center.y, center.z + cameraZ);
                    this.controls.target.copy(center);
                }
            },

            showAlert(msg, type) {
                const container = document.getElementById('alertsContainer');
                const alert = document.createElement('div');
                alert.className = `alert alert-${type}`;
                alert.textContent = msg;
                container.appendChild(alert);
                setTimeout(() => alert.remove(), 3000);
            },

            openModal(id) {
                document.getElementById(id).classList.add('active');
            },

            closeModal(id) {
                document.getElementById(id).classList.remove('active');
            },

            switchTab(tab) {
                document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
                document.getElementById(`${tab}-tab`).classList.add('active');
                event.target.classList.add('active');
            },

            render() {
                if (!this.current) return;

                document.getElementById('projectsList').innerHTML = this.projects.map(p => `
                    <div class="list-item ${this.current.id === p.id ? 'active' : ''}" onclick="APP.selectProject(${p.id})">
                        <div class="list-item-title">📦 ${p.name}</div>
                        <div class="list-item-desc">${p.hotspots.length} مناطق</div>
                    </div>
                `).join('');

                document.getElementById('hotspotsList').innerHTML = this.current.hotspots.map(h => `
                    <div class="list-item">
                        <div class="list-item-title">
                            🎯 ${h.name}
                            <button onclick="APP.deleteHotspot(${h.id})" style="background: #ef4444; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 11px;">حذف</button>
                        </div>
                        <div class="list-item-desc">${h.desc}</div>
                    </div>
                `).join('');

                document.getElementById('camerasList').innerHTML = this.current.cameras.map(c => `
                    <div class="list-item">
                        <div class="list-item-title">
                            📷 ${c.name}
                            <button onclick="APP.deleteCamera(${c.id})" style="background: #ef4444; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 11px;">حذف</button>
                        </div>
                    </div>
                `).join('');

                document.getElementById('tourList').innerHTML = this.current.tour.map((t, i) => `
                    <div class="list-item">
                        <div class="list-item-title">الخطوة ${i + 1}</div>
                        <div class="list-item-desc">${t.title} (${t.duration}ث)</div>
                    </div>
                `).join('');

                document.getElementById('tabsContainer').style.display = this.current ? 'block' : 'none';
            },

            deleteHotspot(id) {
                this.current.hotspots = this.current.hotspots.filter(h => h.id !== id);
                this.saveProjects();
                this.render();
            },

            deleteCamera(id) {
                this.current.cameras = this.current.cameras.filter(c => c.id !== id);
                this.current.tour = this.current.tour.filter(t => t.cameraId !== id);
                this.saveProjects();
                this.render();
            },

            selectProject(id) {
                this.current = this.projects.find(p => p.id === id);
                this.render();
            },

            saveProjects() {
                localStorage.setItem('wings', JSON.stringify(this.projects));
            },

            loadProjects() {
                const saved = localStorage.getItem('wings');
                if (saved) {
                    this.projects = JSON.parse(saved);
                    if (this.projects.length > 0) this.current = this.projects[0];
                }
                this.render();
            },

            setupEvents() {
                document.getElementById('fileInput').addEventListener('change', (e) => {
                    if (e.target.files[0]) this.loadGLB(e.target.files[0]);
                });

                document.querySelectorAll('.color-option').forEach(opt => {
                    opt.addEventListener('click', (e) => {
                        document.querySelectorAll('.color-option').forEach(o => o.classList.remove('active'));
                        e.target.classList.add('active');
                        this.selectedColor = e.target.dataset.color;
                    });
                });

                document.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    document.getElementById('fileLabel').style.opacity = '0.8';
                });

                document.addEventListener('dragleave', () => {
                    document.getElementById('fileLabel').style.opacity = '1';
                });

                document.addEventListener('drop', (e) => {
                    e.preventDefault();
                    document.getElementById('fileLabel').style.opacity = '1';
                    if (e.dataTransfer.files[0]) this.loadGLB(e.dataTransfer.files[0]);
                });
            },

            onResize() {
                const container = document.getElementById('canvas-container');
                const w = container.clientWidth;
                const h = container.clientHeight;
                this.camera.aspect = w / h;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(w, h);
            },

            animate() {
                requestAnimationFrame(() => this.animate());
                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }
        };

        document.addEventListener('DOMContentLoaded', () => APP.init());
    </script>
</body>
</html>
